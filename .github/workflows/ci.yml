name: CI

# Research_Agent and Outreach_Agent are independent (separate Supabase
# projects, separate dependency trees), so each gets its own job and none
# block the others. Both Python suites run fully offline against an
# in-memory PostgREST fake (see each project's tests/conftest.py) -- no
# secrets are needed here. Server/ is the thin single-port composition layer
# that mounts both agents' apps under one process/port (see Server/app.py);
# its job installs all three editable, same as running it for real.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  research-agent:
    name: Research Agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Research_Agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e .
      - name: Run tests
        run: pytest -v

  outreach-agent:
    name: Outreach Agent tests (Outreach + Conversation + Learning + Optimization + Analytics)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Outreach_Agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e .
      - name: Run tests
        run: pytest -v

  server:
    name: Server tests (single-port composition)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e Research_Agent -e Outreach_Agent -e Server
      - name: Run tests
        working-directory: Server
        run: pytest -v

  dashboard:
    name: Dashboard typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        # Known pre-existing failure in src/pages/research/UsageTab.tsx; drop continue-on-error once fixed.
        run: npx tsc -b --noEmit
        continue-on-error: true

[project]
name = "csg-agents"
version = "0.1.0"
description = "CSG Research/ICP Agent - qualifies US companies as staffing prospects"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.69",
    "google-genai>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.scripts]
csg = "csg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
